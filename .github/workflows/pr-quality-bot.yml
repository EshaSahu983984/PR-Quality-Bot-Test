name: PR Quality Bot

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-quality-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r "PR Quality Bot/requirements.txt"

      - name: Validate PR title (quick inline)
        id: title_check
        run: |
          title="${{ github.event.pull_request.title }}"
          if [[ ! $title =~ ^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_-]+\))?:[[:space:]]+.+$ ]]; then
            echo "::error::PR title invalid. Must follow Conventional Commit format."
            echo "::error::Allowed types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
            echo "::error::Format: <type>(optional-scope): <description>"
            echo "::error::Example: 'feat(auth): add JWT token support'"
            exit 1
          fi
          echo "PR title OK"

      - name: Validate PR description (script)
        id: desc_check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 "PR Quality Bot/scripts/check_pr_description.py" \
            --owner "${{ github.repository_owner }}" \
            --repo "${{ github.event.repository.name }}" \
            --pr "${{ github.event.pull_request.number }}"

      - name: File change analysis (sum additions/deletions)
        id: size_check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 "PR Quality Bot/scripts/pr_file_change_sum_github.py" \
            --owner "${{ github.repository_owner }}" \
            --repo "${{ github.event.repository.name }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --threshold "$(jq -r '.max_lines_changed' 'PR Quality Bot/config/thresholds.json')"

      - name: Detect forbidden files in PR
        id: forbidden_check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 "PR Quality Bot/scripts/detect_forbidden_files_github.py" \
            --owner "${{ github.repository_owner }}" \
            --repo "${{ github.event.repository.name }}" \
            --pr "${{ github.event.pull_request.number }}"
