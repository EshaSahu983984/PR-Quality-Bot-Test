trigger: none

pr:
  branches:
    include:
      - '*'

pool:
  vmImage: 'ubuntu-latest'

variables:
  threshold: 300

steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.x'

  - script: |
      pip install -r requirements.txt
      # Validate PR title — ADO provides System.PullRequest.Title at runtime
      title="$(System.PullRequest.Title)"
      if [[ ! "$title" =~ ^(feat|fix|chore|refactor):[[:space:]]+.+$ ]]; then
        echo "##vso[task.logissue type=error]PR title invalid: $title"
        exit 1
      fi
      python3 scripts/check_pr_description_ado.py --project "$(System.TeamProject)" --repo "$(Build.Repository.Name)" --pr "$(System.PullRequest.PullRequestId)"
      python3 scripts/pr_file_change_sum_ado.py --org "https://dev.azure.com/yourOrg" --project "$(System.TeamProject)" --repo "$(Build.Repository.ID)" --pr "$(System.PullRequest.PullRequestId)" --threshold $(threshold)
    displayName: 'Run PR Quality Bot checks (ADO)'
    env:
      AZDO_TOKEN: $(System.AccessToken)
